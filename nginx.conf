server {
    listen 80;
    server_name localhost;

    # Servir el Frontend (Archivos estáticos)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Esto es importante para aplicaciones de una sola página (SPA) o Vue/React/Vite
        try_files $uri $uri/ /index.html;
    }

    # Redirigir todas las peticiones /api/ hacia el Backend de Java
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Redirigir inicio de sesión con Google (OAuth2)
    location /oauth2/ {
        proxy_pass http://backend:8080/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Redirigir el callback de Google (OAuth2)
    location /login/oauth2/ {
        proxy_pass http://backend:8080/login/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
