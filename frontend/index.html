<!doctype html>
<html lang="es" x-data="loginPage()" x-init="init()">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarWash - Iniciar sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css" />
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="page-center">
    <div class="page-panel">
        <h1 class="title">CarWash Pro</h1>
        <p class="subtitle">Ingresa tus credenciales para acceder al sistema</p>

        <form @submit.prevent="login" class="form-stack">
            <div>
                <label class="field-label" for="userCode">Código de Usuario</label>
                <input id="userCode" type="text" x-model="userCode" required class="field-input" placeholder="Ej. ADMIN-123">
            </div>

            <div>
                <label class="field-label" for="password">Contraseña</label>
                <input id="password" type="password" x-model="password" required class="field-input" placeholder="••••••••">
            </div>

            <p x-cloak x-show="error" x-transition x-text="error" class="alert alert-error"></p>

            <button type="submit" :disabled="loading" class="btn btn-block btn-sky">
                <span x-cloak x-show="!loading">Iniciar sesión</span>
                <span x-cloak x-show="loading" class="btn-content">
                    <span class="spinner"></span> Validando...
                </span>
            </button>
            
            <div style="text-align: center; margin: 15px 0; color: #64748b; font-size: 0.9rem;">
                O ingresa como cliente con
            </div>
            
            <a href="/oauth2/authorization/google" class="btn btn-block" style="background-color: white; color: #333; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;">
                <svg width="18" height="18" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                    <path fill="none" d="M0 0h48v48H0z"></path>
                </svg>
                Continuar con Google
            </a>
        </form>

        <p class="subtitle subtitle-footer">
            Sistema de Gestión Integral de Lavado Automotriz
        </p>
    </div>

    <script>
        function loginPage() {
            return {
                userCode: '',
                password: '',
                loading: false,
                error: '',

                async init() {
                    // Revisar si hay errores en la URL (ej. desde OAuth2)
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.get('error') === 'not_registered') {
                        this.error = 'Tu correo no está registrado en el sistema. Solicita acceso al administrador.';
                        window.history.replaceState({}, document.title, window.location.pathname);
                    } else if (urlParams.get('error')) {
                        this.error = 'Error de autenticación.';
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }

                    // Intentar recuperar sesión usando la cookie (llamando a /me)
                    try {
                        const resp = await fetch('/api/auth/me', { credentials: 'include' });
                        if (resp.ok) {
                            const data = await resp.json();
                            sessionStorage.setItem('rol', data.rol);
                            this.redirectToRole(data.rol);
                        } else {
                            sessionStorage.removeItem('rol');
                        }
                    } catch (e) {
                        sessionStorage.removeItem('rol');
                    }
                },

                async login() {
                    this.error = '';
                    this.loading = true;

                    try {
                        const resp = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({ userCode: this.userCode, password: this.password })
                        });

                        let data = {};
                        const contentType = resp.headers.get('content-type');
                        if (contentType && contentType.includes('application/json')) {
                            data = await resp.json();
                        } else {
                            const text = await resp.text();
                            data = { error: text || `Error del servidor (${resp.status})` };
                        }

                        if (!resp.ok) {
                            this.error = data.error || 'Credenciales inválidas. Intente de nuevo.';
                            return;
                        }

                        // Guardamos el rol para validaciones simples de UI, la cookie token ya se guardó automáticamente
                        sessionStorage.setItem('rol', data.rol);
                        this.redirectToRole(data.rol);

                    } catch (e) {
                        console.error("DEBUG LOGIN ERROR:", e);
                        this.error = 'No se pudo conectar con el servidor. Verifique que el Backend esté corriendo.';
                    } finally {
                        this.loading = false;
                    }
                },

                redirectToRole(rol) {
                    if (rol === 'ADMIN') window.location.href = '/admin/index.html';
                    else if (rol === 'ENCARGADO') window.location.href = '/encargado/index.html';
                    else if (rol === 'EMPLEADO') window.location.href = '/empleado/index.html';
                    else if (rol === 'CLIENTE') window.location.href = '/cliente/index.html';
                    else this.error = 'Rol desconocido.';
                }
            }
        }
    </script>
</body>
</html>
