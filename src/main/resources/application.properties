spring.application.name=proyectoaula

jwt.secret=${JWT_SECRET}

spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27018/CarWash}
spring.thymeleaf.check-template-location=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/carwash}
spring.datasource.username=${DB_USER:ander}
spring.datasource.password=${DB_PASSWORD:ander}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile, email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Permitir a Spring procesar cabeceras de Nginx (X-Forwarded-*)
server.forward-headers-strategy=framework