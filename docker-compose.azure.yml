version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: carwash-n8n
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=https://carwash2026.northeurope.cloudapp.azure.com:5678/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=America/Bogota
    volumes:
      # Dejamos la ruta normal de Docker para Máquinas Virtuales Linux
      - n8n_data:/home/node/.n8n
    restart: always

  redis:
    image: redis:alpine
    container_name: carwash-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  backend:
    # La Máquina Virtual construirá la imagen del código fuente directamente
    build: .
    container_name: carwash-backend
    ports:
      - "8080:8080"
    environment:
      # Pasamos las variables dinámicas al contenedor desde el .env
      - MONGO_URI=${MONGO_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI}
    depends_on:
      - redis
    restart: always

  nginx:
    # Construye el frontend con el Dockerfile.frontend que creamos
    build: 
      context: .
      dockerfile: Dockerfile.frontend
    container_name: carwash-frontend
    ports:
      - "80:80"
      - "443:443"
      - "5678:5678"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: always

volumes:
  n8n_data:
  redis_data:
